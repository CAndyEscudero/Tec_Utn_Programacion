<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Tp1</title>
        <style>
            .caja {
                height: 100vh;
                background-color: black;
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                align-items: center;
            }
            .caja_1 {
                height: 100vh;
                background-color: black;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }
            .caja_2 {
                height: 100vh;
                background-color: black;
                display: flex;
                flex-direction: row;
                justify-content: center;
                align-items: center;
                gap: 200px;
            }
            .componente1 {
                width: 200px;
                height: 200px;
                background-color: blue;
                display: flex;
                justify-content: center;
            }
            .componente2 {
                width: 200px;
                height: 200px;
                background-color: yellow;
                display: flex;
                justify-content: center;
            }
        </style>
    </head>

<body>
    <section class="caja">
        <div class="componente1"></div>
        <div class="componente2"></div>
    </section>
    <br>
    <section class="caja_1">
        <div class="componente1"></div>
        <div class="componente2"></div>
    </section>
    <br>
    <section class="caja_2">
        <div class="componente1"></div>
        <div class="componente2"></div>
    </section> 
</body>
</html>
